name: Build and Push KubePlus containers

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GAR
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }} # secret name may need to be changed

      - name: Get latest version of consumerui
        run: |
          LAST_LINE=$(tail -n 1 consumerui/versions.txt | tr -d '\r')
          echo "consumerui_version=${LAST_LINE}" >> $GITHUB_ENV
      - name: Build and Push consumerui
        uses: docker/build-push-action@v6
        with:
          context: ./consumerui
          file: ./consumerui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gcr.io/cloudark-kubeplus/kubeplus/consumerui:${{ env.consumerui_version }}
      - name: Get latest version of webhook-tls-getter
        run: |
          LAST_LINE=$(tail -n 1 deploy/versions.txt | tr -d '\r')
          echo "webhook_tls_getter_version=${LAST_LINE}" >> $GITHUB_ENV
            
      - name: Build and Push webhook-tls-getter
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gcr.io/cloudark-kubeplus/kubeplus/webhook-tls-getter:${{ env.webhook_tls_getter_version }}
